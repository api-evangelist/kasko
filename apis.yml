aid: kasko
name: Kasko
description: >-
  KASKO is an InsurTech-as-a-Service provider offering a modular, no-/low-code
  platform that helps insurers, MGAs, reinsurers, and brokers design, launch,
  and operate digital insurance products end to end. Its full insurance
  operating stack exposes platform functionality and data through a REST API
  (Quote, Offer, Payment, Policy and Data resources), an embeddable KASKO JS
  widget for front-end distribution, and account-level signed webhooks. KASKO
  also provides EU/UK market-access and licensing support, advisory, and
  recruitment services, and is ISO 27001 certified and co-funded by the
  European Union.
